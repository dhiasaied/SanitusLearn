<div class="auth-layout">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="assets/logo.jpg" alt="Logo">
    </div>

    <h1 class="auth-title">Connexion</h1>
    <p class="auth-subtitle">Accédez à votre espace.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="mb-3">
        <div class="auth-label">Email</div>
        <input class="auth-input" type="email" name="email" placeholder="ex: nom@domaine.com" autocomplete="email" required [(ngModel)]="email">
      </div>

      <div class="mb-2">
        <div class="auth-label">Mot de passe</div>
        <input class="auth-input" type="password" name="password" placeholder="Votre mot de passe" autocomplete="current-password" required [(ngModel)]="password">
      </div>

      <div class="auth-row">
        <label class="d-flex align-items-center gap-2" style="font-size: 13px; color:#666;">
          <input type="checkbox" name="remember" class="form-check-input m-0" [(ngModel)]="remember">
          Se souvenir de moi
        </label>
        <a class="auth-link" routerLink="/forget-password">Mot de passe oublié ?</a>
      </div>

      <button class="auth-btn" type="submit">
        <i class="bi bi-box-arrow-in-right me-1"></i>
        Se connecter
      </button>
    </form>

    <div class="auth-divider"></div>

    <div class="auth-foot">
      Pas de compte ?
      <a class="auth-link" routerLink="/register">Créer un compte</a>
    </div>

    <div class="auth-foot" style="margin-top: 8px;">
      <a class="auth-link" routerLink="/"><i class="bi bi-arrow-left me-1"></i>Retour à l'accueil</a>
    </div>
  </div>
</div>
