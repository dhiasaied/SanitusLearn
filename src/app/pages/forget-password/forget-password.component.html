<div class="auth-layout">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="assets/logo.jpg" alt="Logo">
        </div>

        <h1 class="auth-title">Mot de passe oublié</h1>
        <p class="auth-subtitle">Entrez votre email pour recevoir un lien de réinitialisation.</p>

        <form (ngSubmit)="onSubmit()" #forgetPasswordForm="ngForm" novalidate>
            <div class="mb-3">
                <div class="auth-label">Email</div>
                <input class="auth-input" type="email" name="email" placeholder="ex: nom@domaine.com" autocomplete="email" required [(ngModel)]="email">
            </div>

            <button class="auth-btn" type="submit">
                <i class="bi bi-send me-1"></i>
                Envoyer le lien
            </button>
        </form>

        <div class="auth-divider"></div>

        <div class="auth-foot">
            <a class="auth-link" routerLink="/connexion"><i class="bi bi-arrow-left me-1"></i>Retour à la connexion</a>
        </div>

        <div class="auth-foot" style="margin-top: 8px;">
            <a class="auth-link" routerLink="/">Accueil</a>
        </div>
    </div>
</div>
