<div class="courses-page">
    <h1 class="courses-title">My Courses</h1>
    <p class="courses-subtitle">Course overview</p>

    <!-- Filters and Search -->
    <div class="courses-controls">
        <div class="dropdown-wrapper">
            <button class="filter-dropdown">
                All <i class="bi bi-chevron-down"></i>
            </button>
        </div>
        <div class="search-wrapper">
            <input type="text" class="search-input" placeholder="Search">
        </div>
        <div class="dropdown-wrapper">
            <button class="filter-dropdown">
                Sort by course name <i class="bi bi-chevron-down"></i>
            </button>
        </div>
        <div class="dropdown-wrapper">
            <button class="filter-dropdown">
                Card <i class="bi bi-chevron-down"></i>
            </button>
        </div>
    </div>

    <!-- Course Cards Grid -->
    <div class="courses-grid">
        <a routerLink="/course-view" class="course-card-item" style="text-decoration: none; color: inherit;">
            <div class="course-card-header">
                <div class="course-card-pattern"></div>
            </div>
            <div class="course-card-body">
                <h3 class="course-card-name">SOCIOSANITARY CARE FOR DEPENDENT PERSONS IN SOCIAL INSTITUTIONS</h3>
                <div class="course-card-category">HEALTH</div>
                <div class="course-card-footer">
                    <span class="course-progress">17% completed</span>
                    <button class="course-menu-btn" title="More options" (click)="$event.preventDefault(); $event.stopPropagation();">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                </div>
            </div>
        </a>
    </div>
</div>
